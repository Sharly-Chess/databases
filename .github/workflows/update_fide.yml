name: FIDE Database Update

on:
  schedule:
    - cron: '17 5 * * *'  # once a day (source changes at most daily)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-fide-database:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Setup Python
        uses: actions/setup-python@v5.5.0
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install -e .

      - name: Generate FIDE SQLite database
        env:
          ENC_PASSWORD: ${{ secrets.FIDE_DATABASE_ENC_PASSWORD }}
        run: python -u src/fide/generate_fide_sqlite.py --key="$ENC_PASSWORD"

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILES=$(python -c "from fide.generate_fide_sqlite import FideSqliteGenerator as g; s=g(); print(s.output_file, *[s.output_file_for_version(v) for v in s.legacy_versions])")
          # The generator soft-exits (no files) when FIDE is unreachable; keep the
          # last good release untouched in that case instead of wiping it.
          for f in $FILES; do
            if [ ! -f "$f" ]; then
              echo "No database produced (source unavailable); keeping previous release."
              exit 0
            fi
          done
          TAG="fide-latest"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" $FILES \
            --title "FIDE Database" \
            --notes "Auto-updated daily" \
            --latest=false
